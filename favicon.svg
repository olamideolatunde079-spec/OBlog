<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <mask id="favicon-mask">
      <rect width="100" height="100" fill="black" />
      <circle cx="50" cy="50" r="44" fill="white" />
      <circle cx="50" cy="50" r="26.5" fill="black" />
      <!-- Top chevron pointing down -->
      <polygon points="37,23.5 63,23.5 50,39.5" fill="white" />
      <!-- Bottom chevron pointing up -->
      <polygon points="37,76.5 63,76.5 50,60.5" fill="white" />
      <!-- Left horizontal slit -->
      <line x1="0" y1="50" x2="28" y2="50" stroke="black" stroke-width="4.5" stroke-linecap="square" />
      <!-- Top-right 45 deg diagonal slit -->
      <line x1="65" y1="35" x2="94" y2="6" stroke="black" stroke-width="4.5" stroke-linecap="square" />
      <!-- Bottom-right -45 deg diagonal slit -->
      <line x1="65" y1="65" x2="94" y2="94" stroke="black" stroke-width="4.5" stroke-linecap="square" />
    </mask>
  </defs>
  <rect x="0" y="0" width="100" height="100" fill="currentColor" mask="url(#favicon-mask)" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" width="520" height="180">
  <defs>
    <!-- Dark / Light mode adaptive fill -->
    <style>
      .oblog-fill { fill: #0a0a0a; }
      @media (prefers-color-scheme: dark) {
        .dark-mode .oblog-fill { fill: #ffffff; }
      }
    </style>
  </defs>
  
  <!-- O Emblem -->
  <g transform="translate(15, 10)">
    <!-- Top-left arc segment with top notch and left cut -->
    <path class="oblog-fill" d="
      M 80,0
      A 80,80 0 0 1 136.56,23.43
      L 125,35
      A 64,64 0 0 0 80,16
      L 80,45
      L 70,35
      L 60,45
      L 60,16
      A 64,64 0 0 0 16,75
      L 0,75
      L 0,70
      A 80,80 0 0 1 80,0 Z
    "/>
  </g>
</svg>
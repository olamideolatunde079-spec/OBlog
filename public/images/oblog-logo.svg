<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 100" width="340" height="100">
  <defs>
    <mask id="oblog-omask">
      <rect width="100" height="100" fill="black" />
      <circle cx="50" cy="50" r="42" fill="white" />
      <circle cx="50" cy="50" r="25.5" fill="black" />
      <!-- Top chevron pointing down -->
      <polygon points="37.5,24.5 62.5,24.5 50,39.5" fill="white" />
      <!-- Bottom chevron pointing up -->
      <polygon points="37.5,75.5 62.5,75.5 50,60.5" fill="white" />
      <!-- Left horizontal slit -->
      <line x1="0" y1="50" x2="28" y2="50" stroke="black" stroke-width="4.5" stroke-linecap="square" />
      <!-- Top-right 45 deg diagonal slit -->
      <line x1="65" y1="35" x2="92" y2="8" stroke="black" stroke-width="4.5" stroke-linecap="square" />
      <!-- Bottom-right -45 deg diagonal slit -->
      <line x1="65" y1="65" x2="92" y2="92" stroke="black" stroke-width="4.5" stroke-linecap="square" />
    </mask>
  </defs>
  <!-- O Glyph -->
  <rect x="0" y="0" width="100" height="100" fill="#000000" mask="url(#oblog-omask)" />
  <!-- Blog Wordmark -->
  <text x="108" y="70" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-1.5px" fill="#000000">Blog</text>
</svg>